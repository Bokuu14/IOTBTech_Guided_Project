---
- name: Configure Docker on the worker node
  hosts: workers
  become: true

  tasks:
    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: true

    - name: Ensure Docker is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add the ubuntu user to the docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Pull Nginx Docker image
      community.docker.docker_image:
        name: nginx
        source: pull

    - name: Run Nginx container on port 80
      community.docker.docker_container:
        name: web-server
        image: nginx
        state: started
        restart_policy: always
        published_ports:
          - "80:80"

    - name: Inspect the Nginx container
      community.docker.docker_container_info:
        name: web-server
      register: nginx_info

    - name: Verify Nginx container is running
      ansible.builtin.assert:
        that:
          - nginx_info.container.State.Running == true
        fail_msg: "Nginx container failed to start properly."
        success_msg: "Nginx container is running successfully."
